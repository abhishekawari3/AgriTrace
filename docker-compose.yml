version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: agritrace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agritrace

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritrace-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/agritrace
      JWT_SECRET: agritrace_super_secret_key_change_in_production
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agritrace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
